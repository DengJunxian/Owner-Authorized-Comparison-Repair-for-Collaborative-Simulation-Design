[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "policytwin"
version = "0.1.0"
description = "Paired distributional policy evaluation with heterogeneous-agent market simulation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
policytwin = "policytwin.cli:main"
policytwin-frozen-eval = "policytwin.evaluation.os_isolation:main"

[dependency-groups]
# Development-only tools: testing, static typing, and linting/formatting.
dev = [
  "hypothesis==6.156.6",
  "mypy==1.16.1",
  "pytest==8.4.1",
  "ruff==0.12.2",
]

[tool.uv]
# CI and clean-room verification use this exact resolver implementation.
required-version = "==0.7.17"

[tool.hatch.build.targets.wheel]
packages = ["src/policytwin"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
# The accepted historical replay capsule is immutable evidence containing its
# own repository snapshot.  Linting the live tree must neither rewrite it nor
# create nested cache files that invalidate its fixed-layout commitment.
extend-exclude = [
  "experiments/exact_finite_canary_s_x_replay_capsule",
  "release/anonymous_submission_v2",
  "release/clean_snapshot_v2",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
